name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - label: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
          - label: Windows
            platform: windows-latest
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kinkel v__VERSION__ — Descargas para escritorio"
          releaseBody: |
            ## Kinkel v__VERSION__

            Cualquier tecla vuela hasta la pizarra, la barra espaciadora se lee
            como **«espacio»** y cada tecla suena como una nota de piano. En la
            versión web aparece un botón de descarga para instalar la app de
            escritorio.

            ### Descargas

            - **Windows 10/11 (64 bits):** instalador `.exe` (NSIS) o `.msi`.
            - **macOS (Apple Silicon e Intel):** `.dmg` universal.
            - **Linux (64 bits):** `.AppImage` o paquete `.deb`.

            ### Notas de instalación

            - **macOS:** la app no está firmada; la primera vez hay que abrirla
              desde **Ajustes → Privacidad y seguridad → Abrir igualmente**.
            - **Windows:** puede aparecer SmartScreen porque el instalador no
              está firmado. Usa **Más información → Ejecutar de todas formas**
              solo si lo descargaste desde este release oficial.
            - **Linux AppImage:** dale permisos con
              `chmod +x Kinkel_*.AppImage` y ejecútalo.

            Los instaladores se compilan automáticamente en GitHub Actions para
            Windows, macOS y Linux. No se compila nada en el equipo local.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false
          assetNamePattern: "Kinkel_[version]_[platform]_[arch][setup][ext]"
          args: ${{ matrix.args }}
